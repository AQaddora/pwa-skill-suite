<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      body { margin: 0; font-family: system-ui; }
      #open { min-width: 44px; min-height: 44px; }
      #sheet {
        display: none;
        position: fixed;
        top: 24px;
        left: 12px;
        width: 420px;
        height: 760px;
        overflow: visible;
        background: white;
        z-index: 20;
      }
      #sheet.open { display: block; }
      #close { position: absolute; bottom: 0; min-width: 44px; min-height: 44px; }
      .tabbar { position: fixed; inset: auto 0 0; height: 56px; background: #111; z-index: 30; }
    </style>
  </head>
  <body>
    <button id="open" data-pwa-role="overlayTrigger">Open</button>
    <section id="sheet" role="dialog" aria-label="Long menu" data-pwa-role="overlay">
      <p>Long content</p>
      <div style="height: 680px">No internal scroll owner</div>
      <button id="close" data-pwa-role="overlayCloseVia">Close</button>
    </section>
    <nav class="tabbar" data-pwa-role="tabbar">Tabs</nav>
    <script>
      const sheet = document.getElementById('sheet');
      document.getElementById('open').onclick = () => sheet.classList.add('open');
      document.getElementById('close').onclick = () => sheet.classList.remove('open');
    </script>
  </body>
</html>
