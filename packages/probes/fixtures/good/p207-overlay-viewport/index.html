<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <style>
      body { margin: 0; font-family: system-ui; }
      #open, #close, #open-nested, #close-nested { min-width: 44px; min-height: 44px; }
      .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        place-items: end center;
        padding: 8px;
        background: rgb(0 0 0 / 45%);
        z-index: 100;
      }
      .backdrop.open { display: grid; }
      .sheet {
        box-sizing: border-box;
        display: flex;
        inline-size: min(32rem, 100%);
        max-block-size: calc(100dvh - 16px);
        flex-direction: column;
        overflow: hidden;
        border: 0;
        background: white;
      }
      .content { min-block-size: 0; overflow-y: auto; overscroll-behavior: contain; }
      .spacer { block-size: 720px; }
      .actions { position: sticky; inset-block-end: 0; background: white; }
      #nested-backdrop { z-index: 200; }
      .tabbar { position: fixed; inset: auto 0 0; height: 56px; background: #111; z-index: 30; }
    </style>
  </head>
  <body>
    <button id="open" data-pwa-role="overlayTrigger">Open</button>
    <div id="backdrop" class="backdrop">
      <section id="sheet" class="sheet" role="dialog" aria-label="Long menu" data-pwa-role="overlay">
        <div class="content">
          <p>Long content</p>
          <div class="spacer"></div>
          <button id="open-nested">Open install help</button>
        </div>
        <div class="actions"><button id="close" data-pwa-role="overlayCloseVia">Close</button></div>
      </section>
    </div>
    <div id="nested-backdrop" class="backdrop">
      <section id="nested" class="sheet" role="dialog" aria-label="Install help">
        <div class="content"><div class="spacer"></div></div>
        <div class="actions"><button id="close-nested">Close help</button></div>
      </section>
    </div>
    <nav class="tabbar" data-pwa-role="tabbar">Tabs</nav>
    <script>
      const backdrop = document.getElementById('backdrop');
      const nested = document.getElementById('nested-backdrop');
      document.getElementById('open').onclick = () => backdrop.classList.add('open');
      document.getElementById('close').onclick = () => backdrop.classList.remove('open');
      document.getElementById('open-nested').onclick = () => nested.classList.add('open');
      document.getElementById('close-nested').onclick = () => nested.classList.remove('open');
    </script>
  </body>
</html>
