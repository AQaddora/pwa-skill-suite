<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" /><title>back-overlay-good</title>
<style>.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none}.overlay.open{display:block}</style></head>
<body>
  <button id="open" data-pwa-role="overlayTrigger">Open</button>
  <div class="overlay" role="dialog" aria-modal="true" data-pwa-role="overlay" id="ov">
    <button id="close" data-pwa-role="overlayCloseVia">Close</button>
  </div>
  <script>
    const ov = document.getElementById('ov');
    function open() { ov.classList.add('open'); history.pushState({ overlay: true }, ''); }
    function close() { if (ov.classList.contains('open')) ov.classList.remove('open'); }
    document.getElementById('open').onclick = open;
    document.getElementById('close').onclick = () => { close(); history.back(); };
    // Hardware/gesture back pops the pushed state and closes the overlay, staying on the page.
    window.addEventListener('popstate', close);
  </script>
</body></html>
